name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-008: Explicit permissions block — read-only for CI.
permissions:
  contents: read

# DX-007: Cancel superseded runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Test (offline)
        run: npm test

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (high+)
        run: npm audit --audit-level=high
