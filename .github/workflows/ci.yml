name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-008: Explicit permissions block — read-only for CI.
permissions:
  contents: read

# DX-007: Cancel superseded runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node ${{ matrix.node }} on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 5

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        timeout-minutes: 5

      - name: Build
        run: npm run build
        timeout-minutes: 5

      - name: Test (offline)
        run: npm test
        timeout-minutes: 5

      # Production HIGH-severity advisories are a release boundary.
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
        timeout-minutes: 5

      # Development-only transitive advisories remain visible without making
      # every source change depend on unrelated toolchain releases.
      - name: Audit all dependencies (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
        timeout-minutes: 5
