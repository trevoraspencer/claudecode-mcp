name: Release

on:
  push:
    tags:
      - "v*"

# Release validation only — no publish secrets required.
# GITHUB_TOKEN is auto-provisioned for artifact upload.
permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Test (offline)
        run: npm test

      # L6: Non-blocking by design, matching ci.yml (see CHANGELOG 1.0.1) —
      # advisories are surfaced in the run log without blocking a release
      # on a transitive dep the project cannot immediately bump.
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Audit all dependencies (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Pack (dry-run)
        run: npm pack --dry-run

  package:
    name: Package tarball
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build

      - name: Pack
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: "claudecode-mcp-*.tgz"
          retention-days: 30
