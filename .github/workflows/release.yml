name: Release

on:
  push:
    tags:
      - "v*"

# Release validation only — no publish secrets required.
# GITHUB_TOKEN is auto-provisioned for artifact upload.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate release on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Check formatting
        run: npm run format:check
        timeout-minutes: 5

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        timeout-minutes: 5

      - name: Build
        run: npm run build
        timeout-minutes: 5

      - name: Test (offline)
        run: npm test
        timeout-minutes: 5

      # L6: Non-blocking by design, matching ci.yml (see CHANGELOG 1.0.1) —
      # advisories are surfaced in the run log without blocking a release
      # on a transitive dep the project cannot immediately bump.
      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
        timeout-minutes: 5

      - name: Audit all dependencies (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
        timeout-minutes: 5

      - name: Pack (dry-run)
        run: npm pack --dry-run
        timeout-minutes: 5

  package:
    name: Package tarball
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build
        timeout-minutes: 8

      - name: Pack
        run: npm pack
        timeout-minutes: 5

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-tarball
          path: "claudecode-mcp-*.tgz"
          retention-days: 14
